// 顶层 build.gradle - 项目级配置（使用腾讯云镜像）
buildscript {
    repositories {
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-google/' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-central/' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-gradle-plugin/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
