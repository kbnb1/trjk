# 项目级 Gradle 配置
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=18080 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=18080
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.home=/opt/jdk-17.0.2

# HTTP/HTTPS 代理（必须显式指定，Gradle不读取HTTP_PROXY环境变量）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local

# AndroidX 配置
android.useAndroidX=true
android.nonTransitiveRClass=true

# 允许路径中包含非ASCII字符（中文项目名）
android.overridePathCheck=true
# 允许路径检查异常
android.se.supportDeprecatedAapt2=true
